name: Deploy to Alwaysdata

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ssh-admisionescup.alwaysdata.net
          username: admisionescup
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/www
            git pull origin main
